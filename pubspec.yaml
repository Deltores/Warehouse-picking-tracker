name: picklist_tracker
description: "Android tablet application for Excel picklist tracking, FIFO work order allocation, and session management."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0
  excel: ^4.0.6
  file_picker: ^12.3.0
  intl: ^0.19.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.2
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  test: ^1.25.8

flutter:
  uses-material-design: true
